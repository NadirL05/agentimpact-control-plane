---
# Runtime — rollback dist (marqueur app-dist.absent), sans systemctl/Docker.
- name: Test hermesctl rollback app-dist absent
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hermesctl_rollback_restart_api: false
  tasks:
    - name: Vérifier backup scripts disponible
      stat:
        path: "{{ rollback_scripts_dir }}"
      register: scripts_backup

    - name: Vérifier backup sources API disponible
      stat:
        path: "{{ rollback_api_src_dir }}"
      register: api_src_backup

    - name: Vérifier backup compose.yml disponible
      stat:
        path: "{{ rollback_compose_file }}"
      register: compose_backup

    - name: Échec si backup bundle incomplet
      fail:
        msg: "Rollback impossible — bundle hermesctl-v1 incomplet (scripts, app/src ou compose.yml)"
      when: >
        not scripts_backup.stat.exists
        or not api_src_backup.stat.exists
        or not compose_backup.stat.exists

    - name: Vérifier backup dist disponible
      stat:
        path: "{{ rollback_dist_dir }}"
      register: dist_backup

    - name: Vérifier marqueur app-dist.absent
      stat:
        path: "{{ rollback_bundle_dir }}/app-dist.absent"
      register: dist_absent_marker

    - name: Supprimer dist créé par déploiement (aucun dist initial)
      file:
        path: "{{ repo_root }}/app/dist"
        state: absent
      when: dist_absent_marker.stat.exists | default(false)

    - name: Restaurer dist versionné pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_dist_dir }}/"
        dest: "{{ repo_root }}/app/dist/"
        delete: false
      when:
        - dist_backup.stat.exists | default(false)
        - not (dist_absent_marker.stat.exists | default(false))

    - name: Restaurer scripts versionnés pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_scripts_dir }}/"
        dest: "{{ repo_root }}/scripts/"
        delete: false

    - name: Restaurer sources API versionnées pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_api_src_dir }}/"
        dest: "{{ repo_root }}/app/src/"
        delete: false

    - name: Restaurer compose.yml versionné pre-hermesctl-v1
      copy:
        src: "{{ rollback_compose_file }}"
        dest: "{{ repo_root }}/compose.yml"
        remote_src: true
        mode: "0644"
