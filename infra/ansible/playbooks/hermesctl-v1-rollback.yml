---
# Rollback atomique hermesctl v1

- name: Rollback hermesctl v1
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: /opt/agentimpact
    rollback_scripts_dir: /var/lib/agentimpact/rollback/hermesctl-v1-scripts
  tasks:
    - name: Arrêter bridge
      systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      loop:
        - agentimpact-ctl-bridge.service
        - agentimpact-ctl-bridge.socket

    - name: Retirer agentimpact-runner du groupe agentimpact-ctl (préserve les autres groupes)
      command: gpasswd -d agentimpact-runner agentimpact-ctl
      register: gpasswd_result
      changed_when: gpasswd_result.rc == 0
      failed_when:
        - gpasswd_result.rc != 0
        - "'is not a member' not in gpasswd_result.stderr"

    - name: Vérifier backup scripts disponible
      stat:
        path: "{{ rollback_scripts_dir }}"
      register: scripts_backup

    - name: Échec si backup scripts absent
      fail:
        msg: "Backup scripts introuvable — rollback scripts impossible"
      when: not scripts_backup.stat.exists

    - name: Restaurer scripts versionnés pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_scripts_dir }}/"
        dest: "{{ repo_root }}/scripts/"
        delete: false

    - name: Redémarrer API après restauration scripts
      command: docker compose -f {{ repo_root }}/compose.yml up -d api
      changed_when: true
