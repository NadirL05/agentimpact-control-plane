---
# Rollback atomique hermesctl v1 — restaure dist, scripts, sources API et compose avant redémarrage API.

- name: Rollback hermesctl v1
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: /opt/agentimpact
    rollback_bundle_dir: /var/lib/agentimpact/rollback/hermesctl-v1
    rollback_scripts_dir: "{{ rollback_bundle_dir }}/scripts"
    rollback_api_src_dir: "{{ rollback_bundle_dir }}/app-src"
    rollback_dist_dir: "{{ rollback_bundle_dir }}/app-dist"
    rollback_compose_file: "{{ rollback_bundle_dir }}/compose.yml"
  tasks:
    - name: Arrêter bridge
      systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      loop:
        - agentimpact-ctl-bridge.service
        - agentimpact-ctl-bridge.socket

    - name: Retirer agentimpact-runner du groupe agentimpact-ctl (préserve les autres groupes)
      command: gpasswd -d agentimpact-runner agentimpact-ctl
      register: gpasswd_result
      changed_when: gpasswd_result.rc == 0
      failed_when:
        - gpasswd_result.rc != 0
        - "'is not a member' not in gpasswd_result.stderr"

    - name: Vérifier backup scripts disponible
      stat:
        path: "{{ rollback_scripts_dir }}"
      register: scripts_backup

    - name: Vérifier backup sources API disponible
      stat:
        path: "{{ rollback_api_src_dir }}"
      register: api_src_backup

    - name: Vérifier backup compose.yml disponible
      stat:
        path: "{{ rollback_compose_file }}"
      register: compose_backup

    - name: Échec si backup bundle incomplet
      fail:
        msg: "Rollback impossible — bundle hermesctl-v1 incomplet (scripts, app/src ou compose.yml)"
      when: >
        not scripts_backup.stat.exists
        or not api_src_backup.stat.exists
        or not compose_backup.stat.exists

    - name: Vérifier backup dist disponible
      stat:
        path: "{{ rollback_dist_dir }}"
      register: dist_backup

    - name: Vérifier marqueur app-dist.absent
      stat:
        path: "{{ rollback_bundle_dir }}/app-dist.absent"
      register: dist_absent_marker

    - name: Supprimer dist créé par déploiement (aucun dist initial)
      file:
        path: "{{ repo_root }}/app/dist"
        state: absent
      when: dist_absent_marker.stat.exists | default(false)

    - name: Restaurer dist versionné pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_dist_dir }}/"
        dest: "{{ repo_root }}/app/dist/"
        delete: false
      when:
        - dist_backup.stat.exists | default(false)
        - not (dist_absent_marker.stat.exists | default(false))

    - name: Restaurer package.json runtime depuis rollback
      copy:
        src: "{{ rollback_bundle_dir }}/app-package.json"
        dest: "{{ repo_root }}/app/package.json"
        remote_src: true
        owner: hermes
        group: hermes
        mode: "0644"
      failed_when: false

    - name: Restaurer package-lock.json runtime depuis rollback
      copy:
        src: "{{ rollback_bundle_dir }}/app-package-lock.json"
        dest: "{{ repo_root }}/app/package-lock.json"
        remote_src: true
        owner: hermes
        group: hermes
        mode: "0644"
      failed_when: false

    - name: Régénérer node_modules runtime depuis lock (omit=dev)
      become: true
      become_user: hermes
      shell: |
        set -euo pipefail
        cd "{{ repo_root }}/app"
        test -f package.json
        test -f package-lock.json
        npm ci --omit=dev
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Restaurer scripts versionnés pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_scripts_dir }}/"
        dest: "{{ repo_root }}/scripts/"
        delete: false

    - name: Restaurer sources API versionnées pre-hermesctl-v1
      synchronize:
        src: "{{ rollback_api_src_dir }}/"
        dest: "{{ repo_root }}/app/src/"
        delete: false

    - name: Restaurer compose.yml versionné pre-hermesctl-v1
      copy:
        src: "{{ rollback_compose_file }}"
        dest: "{{ repo_root }}/compose.yml"
        remote_src: true
        mode: "0644"

    - name: Redémarrer API après restauration bundle complète
      command: docker compose -f {{ repo_root }}/compose.yml up -d api
      changed_when: true
      when: hermesctl_rollback_restart_api | default(true) | bool
