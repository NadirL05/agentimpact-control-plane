---
# Déploiement routeur Slack + worker Grok v1 + consumers inbox Hermès/Ana
# Installe unités/scripts, applique migration 002, active au boot :
#   - agentimpact-slack-router.service
#   - agentimpact-grok-worker.socket (pas le .service — socket activation)
#   - agentimpact-gateway-inbox-hermes.service
#   - agentimpact-gateway-inbox-ana.service (profil agentimpact-growth)
# Devin : stub fail-closed dans le routeur (pas d'unité systemd).

- name: Deploy slack-grok-router v1
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: /opt/agentimpact
    work_src: "{{ playbook_dir }}/../../../"
    rollback_bundle_dir: /var/lib/agentimpact/rollback/slack-grok-router-v1
    rollback_dist_dir: "{{ rollback_bundle_dir }}/app-dist"
    rollback_scripts_dir: "{{ rollback_bundle_dir }}/scripts"
    rollback_systemd_dir: "{{ rollback_bundle_dir }}/systemd"
    rollback_tmpfiles_dir: "{{ rollback_bundle_dir }}/tmpfiles"
    rollback_config_dir: "{{ rollback_bundle_dir }}/config"
    rollback_pg_backup_dir: "{{ rollback_bundle_dir }}/pg-backup"
    grok_agent_cli: /var/lib/cursor-grok-worker/.local/bin/agent
    grok_workspace: /opt/agentimpact/grokbot/workspace
    min_disk_mb: 1024
    systemd_units:
      - agentimpact-slack-router.service
      - agentimpact-grok-worker.service
      - agentimpact-grok-worker.socket
      - agentimpact-gateway-inbox-hermes.service
      - agentimpact-gateway-inbox-ana.service
    managed_scripts:
      - grok-agent-run.sh
      - gateway-inbox-consumer.py
    managed_configs:
      - /etc/agentimpact/slack-router.env
      - /etc/agentimpact/grok-worker.env
      - /etc/agentimpact/gateway-inbox.env
  tasks:
    - name: Vérifier compose.yml lisible par root
      stat:
        path: "{{ repo_root }}/compose.yml"
      register: compose_stat
      failed_when: not compose_stat.stat.exists or not compose_stat.stat.readable

    - name: Vérifier services api et db dans compose
      shell: |
        set -euo pipefail
        grep -qE '^\s+db:' "{{ repo_root }}/compose.yml"
        grep -qE '^\s+api:' "{{ repo_root }}/compose.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Vérifier espace disque suffisant
      shell: |
        set -euo pipefail
        avail=$(df -BM --output=avail "{{ repo_root }}" | tail -1 | tr -dc '0-9')
        if [ "$avail" -lt {{ min_disk_mb }} ]; then
          echo "insufficient_disk_mb:${avail}" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Créer groupe agentimpact-grok-client
      group:
        name: agentimpact-grok-client
        system: true
        state: present

    - name: Créer groupe agentimpact-slack-router
      group:
        name: agentimpact-slack-router
        system: true
        state: present

    - name: Vérifier si cursor-grok-worker existe déjà
      command: getent passwd cursor-grok-worker
      register: grok_user_getent
      changed_when: false
      failed_when: false

    - name: Créer groupe cursor-grok-worker
      group:
        name: cursor-grok-worker
        system: true
        state: present

    - name: Créer utilisateur cursor-grok-worker si absent
      user:
        name: cursor-grok-worker
        group: cursor-grok-worker
        home: /var/lib/cursor-grok-worker
        shell: /usr/sbin/nologin
        system: true
        create_home: true
      when: grok_user_getent.rc != 0

    - name: Ajouter cursor-grok-worker au groupe agentimpact-grok-client
      user:
        name: cursor-grok-worker
        groups: agentimpact-grok-client
        append: true

    - name: Créer utilisateur agentimpact-slack-router
      user:
        name: agentimpact-slack-router
        groups: agentimpact-grok-client
        append: true
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Sécuriser répertoire app pour traverse groupe grok-client
      file:
        path: "{{ repo_root }}/app"
        state: directory
        owner: hermes
        group: agentimpact-grok-client
        mode: "0710"

    - name: Créer et sécuriser workspace Grok
      file:
        path: "{{ grok_workspace }}"
        state: directory
        owner: cursor-grok-worker
        group: cursor-grok-worker
        mode: "0750"

    - name: Vérifier CLI Cursor agent présent et exécutable
      stat:
        path: "{{ grok_agent_cli }}"
      register: grok_agent_cli_stat
      failed_when: >
        not grok_agent_cli_stat.stat.exists
        or not grok_agent_cli_stat.stat.executable

    - name: Vérifier version CLI Cursor (sans exécution payante)
      command: "{{ grok_agent_cli }} --version"
      register: grok_agent_version
      changed_when: false
      failed_when: grok_agent_version.rc != 0

    - name: Vérifier credentials routeur Slack
      stat:
        path: "/etc/agentimpact/credentials/{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - slack-router-bot-token
        - slack-router-app-token
        - slack-router-db-password
        - gateway-inbox-bridge-token
      register: router_cred_files
      no_log: true

    - name: Échec si un credential routeur est absent
      assert:
        that:
          - router_cred_files.results | map(attribute='stat.exists') | list | min
        fail_msg: missing_required_credential

    - name: Vérifier credential Grok worker
      stat:
        path: /etc/agentimpact/credentials/cursor-grok-api-key
        get_checksum: false
        get_mime: false
      register: grok_cred
      no_log: true

    - name: Échec si credential Grok absent
      assert:
        that:
          - grok_cred.stat.exists
        fail_msg: missing_required_credential

    - name: Vérifier permissions sûres credentials
      shell: |
        set -euo pipefail
        for f in /etc/agentimpact/credentials/*; do
          [ -e "$f" ] || continue
          [ ! -L "$f" ] || { echo "unsafe_permissions" >&2; exit 1; }
          [ -f "$f" ] || { echo "unsafe_permissions" >&2; exit 1; }
          perms=$(stat -c '%a' "$f")
          other=$((perms % 10))
          group=$(((perms / 10) % 10))
          if [ "$other" -ge 4 ] || [ "$group" -ge 4 ]; then
            echo "unsafe_permissions" >&2
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Vérifier artefacts build host requis
      stat:
        path: "{{ repo_root }}/app/dist/{{ item }}"
      loop:
        - slack-router/daemon.js
        - grok-worker/server.js
      register: host_dist_files

    - name: Échec si un artefact build host est absent
      assert:
        that:
          - host_dist_files.results | map(attribute='stat.exists') | list | min
        fail_msg: missing_required_host_dist_artifact

    - name: Vérifier package.json runtime ESM présent
      stat:
        path: "{{ repo_root }}/app/package.json"
      register: app_package_json

    - name: Échec si package.json runtime absent
      assert:
        that:
          - app_package_json.stat.exists
        fail_msg: missing_runtime_package_json_run_hermesctl_first

    - name: Vérifier dépendances runtime critiques
      shell: |
        set -euo pipefail
        grep -q '"type"[[:space:]]*:[[:space:]]*"module"' "{{ repo_root }}/app/package.json"
        test -d "{{ repo_root }}/app/node_modules/@slack/web-api"
        test -d "{{ repo_root }}/app/node_modules/@slack/socket-mode"
        test -d "{{ repo_root }}/app/node_modules/pg"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Créer répertoire rollback bundle slack-grok-router-v1
      file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ rollback_bundle_dir }}"
        - "{{ rollback_dist_dir }}"
        - "{{ rollback_scripts_dir }}"
        - "{{ rollback_systemd_dir }}"
        - "{{ rollback_tmpfiles_dir }}"
        - "{{ rollback_config_dir }}"
        - "{{ rollback_pg_backup_dir }}"

    - name: Vérifier dist existant avant sauvegarde
      stat:
        path: "{{ repo_root }}/app/dist"
      register: existing_dist

    - name: Sauvegarder dist pre-slack-grok
      synchronize:
        src: "{{ repo_root }}/app/dist/"
        dest: "{{ rollback_dist_dir }}/"
        archive: true
        delete: false
      delegate_to: localhost
      when: existing_dist.stat.exists

    - name: Sauvegarder package.json runtime pre-slack-grok
      copy:
        src: "{{ repo_root }}/app/package.json"
        dest: "{{ rollback_bundle_dir }}/app-package.json"
        remote_src: true
        mode: "0644"
      failed_when: false

    - name: Sauvegarder package-lock.json runtime pre-slack-grok
      copy:
        src: "{{ repo_root }}/app/package-lock.json"
        dest: "{{ rollback_bundle_dir }}/app-package-lock.json"
        remote_src: true
        mode: "0644"
      failed_when: false

    - name: Sauvegarder scripts gérés pre-slack-grok
      copy:
        src: "{{ repo_root }}/scripts/{{ item }}"
        dest: "{{ rollback_scripts_dir }}/{{ item }}"
        remote_src: true
        mode: "0750"
      loop: "{{ managed_scripts }}"
      failed_when: false

    - name: Sauvegarder unités systemd existantes
      copy:
        src: "/etc/systemd/system/{{ item }}"
        dest: "{{ rollback_systemd_dir }}/{{ item }}"
        remote_src: true
        mode: "0644"
      loop: "{{ systemd_units }}"
      failed_when: false

    - name: Sauvegarder tmpfiles existants
      copy:
        src: "/etc/tmpfiles.d/agentimpact-slack-router.conf"
        dest: "{{ rollback_tmpfiles_dir }}/agentimpact-slack-router.conf"
        remote_src: true
        mode: "0644"
      failed_when: false

    - name: Vérifier configs non secrètes avant sauvegarde
      shell: |
        set -euo pipefail
        for cfg in /etc/agentimpact/slack-router.env /etc/agentimpact/grok-worker.env /etc/agentimpact/gateway-inbox.env; do
          [ -f "$cfg" ] || continue
          if grep -qE '^(PGPASSWORD|SLACK_ROUTER_BRIDGE_TOKEN|CURSOR_API_KEY|DATABASE_URL)=' "$cfg"; then
            echo "secret_in_non_secret_config:$cfg" >&2
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Sauvegarder configurations non secrètes existantes
      copy:
        src: "{{ item }}"
        dest: "{{ rollback_config_dir }}/{{ item | basename }}"
        remote_src: true
        mode: "0640"
      loop: "{{ managed_configs }}"
      failed_when: false

    - name: Sauvegarde PostgreSQL pre-migration 002
      include_tasks: ../tasks/slack_grok_pg_backup_002.yml

    - name: Appliquer migration 002 slack router (stdin via service db)
      shell: |
        set -euo pipefail
        docker compose -f "{{ repo_root }}/compose.yml" exec -T db \
          psql -v ON_ERROR_STOP=1 -U agentimpact_app -d agentimpact \
          < "{{ repo_root }}/app/src/migrations/002_slack_router.sql"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Installer unités systemd routeur, worker Grok et consumers inbox
      copy:
        src: "{{ work_src }}/infra/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop: "{{ systemd_units }}"

    - name: Retirer drop-in obsolète cursor-home (désormais dans l unit git)
      file:
        path: /etc/systemd/system/agentimpact-grok-worker.service.d/10-cursor-home.conf
        state: absent

    - name: Installer tmpfiles.d routeur
      copy:
        src: "{{ work_src }}/infra/systemd/agentimpact-slack-router.tmpfiles.conf"
        dest: /etc/tmpfiles.d/agentimpact-slack-router.conf
        mode: "0644"

    - name: Installer wrapper Grok (groupe grok-client)
      copy:
        src: "{{ work_src }}/infra/scripts/grok-agent-run.sh"
        dest: /opt/agentimpact/scripts/grok-agent-run.sh
        owner: agentimpact-runner
        group: agentimpact-grok-client
        mode: "0750"

    - name: Installer inbox consumer (exécutable par User=hermes)
      copy:
        src: "{{ work_src }}/infra/scripts/gateway-inbox-consumer.py"
        dest: /opt/agentimpact/scripts/gateway-inbox-consumer.py
        owner: root
        group: hermes
        mode: "0750"

    - name: Vérifier ownership wrapper Grok, consumer inbox et répertoire app
      shell: |
        set -euo pipefail
        test "$(stat -c '%U:%G %a' /opt/agentimpact/scripts/grok-agent-run.sh)" = "agentimpact-runner:agentimpact-grok-client 750"
        test "$(stat -c '%U:%G %a' /opt/agentimpact/scripts/gateway-inbox-consumer.py)" = "root:hermes 750"
        test "$(stat -c '%U:%G %a' '{{ repo_root }}/app')" = "hermes:agentimpact-grok-client 710"
        # hermes doit pouvoir exécuter le consumer (évite systemd 203/EXEC)
        sudo -u hermes test -x /opt/agentimpact/scripts/gateway-inbox-consumer.py
        grep -q '/var/lib/cursor-grok-worker' /etc/systemd/system/agentimpact-grok-worker.service
        grep -q '/home/hermes/.hermes' /etc/systemd/system/agentimpact-gateway-inbox-hermes.service
        grep -q '/home/hermes/.hermes' /etc/systemd/system/agentimpact-gateway-inbox-ana.service
        test ! -f /etc/systemd/system/agentimpact-grok-worker.service.d/10-cursor-home.conf
      args:
        executable: /bin/bash
      changed_when: false

    - name: Installer template gateway-inbox.env si absent
      copy:
        src: "{{ work_src }}/infra/templates/gateway-inbox.env.example"
        dest: /etc/agentimpact/gateway-inbox.env
        mode: "0640"
        owner: root
        group: hermes
        force: false

    - name: Appliquer tmpfiles
      command: systemd-tmpfiles --create /etc/tmpfiles.d/agentimpact-slack-router.conf
      changed_when: false

    - name: Recharger systemd avant activation boot
      command: systemctl daemon-reload
      changed_when: false

    - name: Activer et démarrer Slack Router au boot
      systemd:
        name: agentimpact-slack-router.service
        enabled: true
        state: started
        daemon_reload: false

    - name: Activer et démarrer socket Grok (pas le service — socket activation)
      systemd:
        name: agentimpact-grok-worker.socket
        enabled: true
        state: started
        daemon_reload: false

    - name: S'assurer que le service Grok n'est pas enable directement
      systemd:
        name: agentimpact-grok-worker.service
        enabled: false
        daemon_reload: false

    - name: Activer et démarrer consumer inbox Hermès
      systemd:
        name: agentimpact-gateway-inbox-hermes.service
        enabled: true
        state: started
        daemon_reload: false

    - name: Vérifier profil Ana (agentimpact-growth) avant enable
      shell: |
        set -euo pipefail
        test -d /opt/agentimpact/profiles/agentimpact-growth
        test -f /opt/agentimpact/profiles/agentimpact-growth/.env
        test -d /home/hermes/.hermes/profiles/agentimpact-growth
      args:
        executable: /bin/bash
      changed_when: false

    - name: Activer et démarrer consumer inbox Ana
      systemd:
        name: agentimpact-gateway-inbox-ana.service
        enabled: true
        state: started
        daemon_reload: false

    - name: Vérifier services critiques actifs
      shell: |
        set -euo pipefail
        test "$(systemctl is-active agentimpact-slack-router.service)" = "active"
        test "$(systemctl is-active agentimpact-grok-worker.socket)" = "active"
        test "$(systemctl is-active agentimpact-gateway-inbox-hermes.service)" = "active"
        test "$(systemctl is-enabled agentimpact-gateway-inbox-hermes.service)" = "enabled"
        test "$(systemctl is-active agentimpact-gateway-inbox-ana.service)" = "active"
        test "$(systemctl is-enabled agentimpact-gateway-inbox-ana.service)" = "enabled"
        test "$(systemctl is-enabled agentimpact-grok-worker.service)" != "enabled"
      args:
        executable: /bin/bash
      changed_when: false
