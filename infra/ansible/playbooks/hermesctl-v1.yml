---
# Déploiement atomique hermesctl v1
# Ordre critique : tokens + sauvegarde + sync + build hôte + migration + API + bridge.

- name: Deploy hermesctl v1 (atomic)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: /opt/agentimpact
    # playbook_dir = .../infra/ansible/playbooks → racine dépôt = ../../../
    work_src: "{{ playbook_dir }}/../../../"
    rollback_bundle_dir: /var/lib/agentimpact/rollback/hermesctl-v1
    rollback_scripts_dir: "{{ rollback_bundle_dir }}/scripts"
    rollback_api_src_dir: "{{ rollback_bundle_dir }}/app-src"
    rollback_dist_dir: "{{ rollback_bundle_dir }}/app-dist"
    rollback_compose_file: "{{ rollback_bundle_dir }}/compose.yml"
    rollback_pg_backup_dir: "{{ rollback_bundle_dir }}/pg-backup"
    host_build_user: hermes
    app_owner: hermes
    app_group: hermes
    build_staging_dir: /var/lib/agentimpact/build-staging/hermesctl-v1
    min_disk_mb: 1024
  tasks:
    - name: Vérifier compose.yml lisible par root
      stat:
        path: "{{ repo_root }}/compose.yml"
      register: compose_stat
      failed_when: not compose_stat.stat.exists or not compose_stat.stat.readable

    - name: Vérifier services api et db dans compose
      shell: |
        set -euo pipefail
        grep -qE '^\s+db:' "{{ repo_root }}/compose.yml"
        grep -qE '^\s+api:' "{{ repo_root }}/compose.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Vérifier tokens présents (fichiers, pas affichage)
      stat:
        path: "/etc/agentimpact/tokens/{{ item }}.env"
      loop:
        - bridge
        - hermes
        - admin
      register: token_files
      failed_when: not token_files.results | map(attribute='stat.exists') | list | min

    - name: Vérifier permissions sûres tokens et credentials
      shell: |
        set -euo pipefail
        for f in /etc/agentimpact/tokens/*.env /etc/agentimpact/credentials/*; do
          [ -e "$f" ] || continue
          perms=$(stat -c '%a' "$f")
          other=$((perms % 10))
          group=$(((perms / 10) % 10))
          if [ "$other" -ge 4 ] || [ "$group" -ge 4 ]; then
            echo "unsafe_permissions:$f:$perms" >&2
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Vérifier espace disque suffisant
      shell: |
        set -euo pipefail
        avail=$(df -BM --output=avail "{{ repo_root }}" | tail -1 | tr -dc '0-9')
        if [ "$avail" -lt {{ min_disk_mb }} ]; then
          echo "insufficient_disk_mb:${avail}" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Créer groupe système agentimpact-ctl
      group:
        name: agentimpact-ctl
        system: true
        state: present

    - name: Créer compte système agentimpact-ctl
      user:
        name: agentimpact-ctl
        group: agentimpact-ctl
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Vérifier secrets training et dashboard dans .env
      shell: |
        set -euo pipefail
        grep -qE '^TRAINING_FORM_TOKEN=.+' "{{ repo_root }}/.env"
        grep -qE '^DASHBOARD_ACCESS_TOKEN=.+' "{{ repo_root }}/.env"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Créer répertoire rollback bundle hermesctl-v1
      file:
        path: "{{ rollback_bundle_dir }}"
        state: directory
        mode: "0750"

    - name: Créer répertoire sauvegarde PostgreSQL
      file:
        path: "{{ rollback_pg_backup_dir }}"
        state: directory
        mode: "0750"

    - name: Vérifier scripts existants avant sauvegarde
      stat:
        path: "{{ repo_root }}/scripts"
      register: existing_scripts

    - name: Vérifier sources API existantes avant sauvegarde
      stat:
        path: "{{ repo_root }}/app/src"
      register: existing_api_src

    - name: Vérifier dist existant avant sauvegarde
      stat:
        path: "{{ repo_root }}/app/dist"
      register: existing_dist

    - name: Vérifier compose.yml existant avant sauvegarde
      stat:
        path: "{{ repo_root }}/compose.yml"
      register: existing_compose

    - name: Sauvegarder scripts pre-hermesctl-v1
      synchronize:
        src: "{{ repo_root }}/scripts/"
        dest: "{{ rollback_scripts_dir }}/"
        archive: true
        delete: false
      delegate_to: localhost
      when: existing_scripts.stat.exists

    - name: Sauvegarder sources API pre-hermesctl-v1
      synchronize:
        src: "{{ repo_root }}/app/src/"
        dest: "{{ rollback_api_src_dir }}/"
        archive: true
        delete: false
      delegate_to: localhost
      when: existing_api_src.stat.exists

    - name: Sauvegarder dist pre-hermesctl-v1
      synchronize:
        src: "{{ repo_root }}/app/dist/"
        dest: "{{ rollback_dist_dir }}/"
        archive: true
        delete: false
      delegate_to: localhost
      when: existing_dist.stat.exists

    - name: Sauvegarder compose.yml pre-hermesctl-v1
      copy:
        src: "{{ repo_root }}/compose.yml"
        dest: "{{ rollback_compose_file }}"
        remote_src: true
        mode: "0644"
      when: existing_compose.stat.exists

    - name: Sauvegarde PostgreSQL pre-migration 001
      shell: |
        set -euo pipefail
        stamp=$(date -u +%Y%m%d%H%M%S)
        dump="{{ rollback_pg_backup_dir }}/pre-001-${stamp}.dump"
        docker compose -f "{{ repo_root }}/compose.yml" exec -T db \
          pg_dump -U agentimpact_app -d agentimpact --format=custom \
          > "$dump"
        chmod 0600 "$dump"
        echo "$dump" > "{{ rollback_pg_backup_dir }}/latest-001.path"
      args:
        executable: /bin/bash
      changed_when: true
      register: pg_backup_001

    - name: Enregistrer chemin sauvegarde PostgreSQL 001 (sans contenu)
      debug:
        msg: "pg_backup_001={{ pg_backup_001.stdout_lines[-1] | default('unknown') }}"

    - name: Vérifier sauvegarde PostgreSQL non vide
      shell: |
        set -euo pipefail
        latest=$(ls -t "{{ rollback_pg_backup_dir }}"/*.dump 2>/dev/null | head -1)
        test -n "$latest"
        test -s "$latest"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Synchroniser compose.yml
      copy:
        src: "{{ work_src }}/infra/compose.yml"
        dest: "{{ repo_root }}/compose.yml"
        mode: "0644"

    - name: Synchroniser migrations SQL vers app/src/migrations
      synchronize:
        src: "{{ work_src }}/src/migrations/"
        dest: "{{ repo_root }}/app/src/migrations/"
        delete: false

    - name: Synchroniser code API vers app/src
      synchronize:
        src: "{{ work_src }}/src/"
        dest: "{{ repo_root }}/app/src/"
        delete: false

    - name: Propriétaire app/src hermes (sans node_modules hôte)
      file:
        path: "{{ repo_root }}/app/src"
        owner: "{{ app_owner }}"
        group: "{{ app_group }}"
        recurse: true

    - name: Supprimer node_modules hôte sous app/src si présent
      file:
        path: "{{ repo_root }}/app/src/node_modules"
        state: absent

    - name: Créer répertoire staging build
      file:
        path: "{{ build_staging_dir }}"
        state: directory
        owner: "{{ app_owner }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: Synchroniser sources vers staging build
      synchronize:
        src: "{{ work_src }}/src/"
        dest: "{{ build_staging_dir }}/"
        delete: false

    - name: Propriétaire staging build hermes
      file:
        path: "{{ build_staging_dir }}"
        owner: "{{ app_owner }}"
        group: "{{ app_group }}"
        recurse: true

    - name: Build Node dans staging (hermes, indépendant du conteneur API)
      become: true
      become_user: "{{ host_build_user }}"
      shell: |
        set -euo pipefail
        cd "{{ build_staging_dir }}"
        npm ci
        npm run build
        test -f dist/slack-router/daemon.js
        test -f dist/grok-worker/server.js
        if find node_modules -xdev \( -type d -o -type f \) -perm -0002 | grep -q .; then
          echo "world_writable_node_modules" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Installer dist staging vers app/dist
      synchronize:
        src: "{{ build_staging_dir }}/dist/"
        dest: "{{ repo_root }}/app/dist/"
        delete: false

    - name: Propriétaire app/dist hermes
      file:
        path: "{{ repo_root }}/app/dist"
        owner: "{{ app_owner }}"
        group: "{{ app_group }}"
        recurse: true

    - name: Vérifier ownership et permissions app/dist
      shell: |
        set -euo pipefail
        test "$(stat -c '%U:%G' '{{ repo_root }}/app/dist')" = "{{ app_owner }}:{{ app_group }}"
        test ! -d "{{ repo_root }}/app/src/node_modules"
        if find "{{ repo_root }}/app/dist" -xdev \( -type d -o -type f \) -perm -0002 | grep -q .; then
          echo "world_writable_dist" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Appliquer migration SQL proposals (stdin via service db)
      shell: |
        set -euo pipefail
        docker compose -f "{{ repo_root }}/compose.yml" exec -T db \
          psql -U agentimpact_app -d agentimpact \
          < "{{ repo_root }}/app/src/migrations/001_cursor_proposals.sql"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Synchroniser scripts migrés
      synchronize:
        src: "{{ work_src }}/infra/scripts/"
        dest: "{{ repo_root }}/scripts/"
        delete: false

    - name: Installer ctl-bridge
      synchronize:
        src: "{{ work_src }}/infra/ctl-bridge/"
        dest: "{{ repo_root }}/ctl-bridge/"
        delete: false

    - name: Installer client hermesctl
      synchronize:
        src: "{{ work_src }}/infra/runner/hermesctl/"
        dest: "{{ repo_root }}/runner/bin/"
        delete: false

    - name: Installer unités systemd
      copy:
        src: "{{ work_src }}/infra/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - agentimpact-ctl-bridge.socket
        - agentimpact-ctl-bridge.service

    - name: tmpfiles.d agentimpact-ctl
      copy:
        src: "{{ work_src }}/infra/systemd/agentimpact-ctl.conf"
        dest: /etc/tmpfiles.d/agentimpact-ctl.conf
        mode: "0644"

    - name: Appliquer tmpfiles agentimpact-ctl
      command: systemd-tmpfiles --create /etc/tmpfiles.d/agentimpact-ctl.conf
      changed_when: false

    - name: Redémarrer API (auth fail-closed) — après sync code + tokens + scripts
      command: docker compose -f {{ repo_root }}/compose.yml up -d --build api
      changed_when: true

    - name: Activer socket bridge
      systemd:
        name: agentimpact-ctl-bridge.socket
        enabled: true
        state: started
        daemon_reload: true

    - name: Activer service bridge
      systemd:
        name: agentimpact-ctl-bridge.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Ajouter agentimpact-runner au groupe agentimpact-ctl
      user:
        name: agentimpact-runner
        groups: agentimpact-ctl
        append: true
