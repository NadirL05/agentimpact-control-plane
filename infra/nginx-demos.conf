server {
    listen 80;
    server_name demo.agentimpact.fr;
    root /usr/share/nginx/html;

    # Pas d'index de repertoire : un slug non devine ne doit rien reveler.
    autoindex off;
    location = / {
        return 404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
}
