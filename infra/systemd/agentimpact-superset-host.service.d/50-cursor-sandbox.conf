[Service]
# Cursor's root-owned native helper creates user/mount/process/network
# namespaces. AppArmor remains the executable-level gate for userns.
RestrictNamespaces=
RestrictNamespaces=user mnt pid ipc uts cgroup net

# This runs without a prompt, provider call or workspace mutation. Failure is
# fail-closed: Superset host does not start with an unverified/unsandboxed CLI.
ExecStartPre=/usr/local/libexec/agentimpact-cursor-sandbox-preflight --runtime
