model:
  default: qwen/qwen3.5-397b-a17b
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
fallback_providers:
  - provider: openrouter
    model: openai/gpt-5.6-terra
toolsets:
  - hermes-cli
agent:
  max_turns: 12
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
terminal:
  backend: docker
  docker_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  docker_mount_cwd_to_workspace: false
  docker_run_as_host_user: false
  # Reactive uniquement pour Higgsfield (appels API sortants depuis le
  # sandbox). Le conteneur reste la frontiere : pas de montage de host,
  # ressources plafonnees, pas d'acces utilisateur hote.
  docker_network: true
  docker_forward_env:
  - HIGGSFIELD_API_KEY
  docker_volumes:
  - "/home/hermes/.hermes/tools/higgsfield/bin/higgsfield:/usr/local/bin/higgsfield:ro"
  - "/home/hermes/.config/higgsfield:/root/.config/higgsfield:ro"
  docker_persist_across_processes: true
  docker_orphan_reaper: true
  container_cpu: 2
  container_memory: 2048
  container_disk: 10240
  container_persistent: true
  modal_mode: auto
  cwd: /home/hermes
web:
  backend: ''
  search_backend: ''
  extract_backend: ''
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: false
checkpoints:
  enabled: false
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
file_read_max_chars: 100000
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.13
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400
prompt_caching:
  cache_ttl: 5m
  long_lived_prefix: true
  long_lived_ttl: 1h
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
bedrock:
  region: ''
  discovery:
    enabled: true
    provider_filter: []
    refresh_interval: 3600
  guardrail:
    guardrail_identifier: ''
    guardrail_version: ''
    stream_processing_mode: async
    trace: disabled
