services:
  db:
    image: postgres:16-alpine
    container_name: agentimpact-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentimpact
      POSTGRES_USER: agentimpact_app
      # .env ne definit que DB_PASSWORD : POSTGRES_PASSWORD n'existait pas et
      # un `compose up` aurait reinitialise le mot de passe a vide.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/src/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentimpact_app -d agentimpact"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Loopback hôte uniquement : routeur systemd (PGHOST=127.0.0.1).
    # Interdit : 0.0.0.0, :: ou toute exposition publique de PostgreSQL.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ./app/src
    image: agentimpact-control-plane:production
    container_name: agentimpact-api
    restart: unless-stopped
    init: true
    group_add:
      - "${SUPERSET_RPC_CLIENT_GID:-980}"
      # The host token stays owned by Hermes and group-readable. Only this
      # single file is mounted, so the API cannot read the rest of Hermes home.
      - "${GOOGLE_TOKEN_GID:-987}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: agentimpact
      PGUSER: agentimpact_app
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      FULLENRICH_API_KEY: ${FULLENRICH_API_KEY:-}
      FULLENRICH_BASE_URL: ${FULLENRICH_BASE_URL:-https://app.fullenrich.com/api/v2}
      FULLENRICH_WEBHOOK_URL: ${FULLENRICH_WEBHOOK_URL:-}
      FULLENRICH_WEBHOOK_TOKEN: ${FULLENRICH_WEBHOOK_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_HOME_CHANNEL: ${SLACK_HOME_CHANNEL:-}
      APPROVAL_WINDOW_MINUTES: ${APPROVAL_WINDOW_MINUTES:-15}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-contact@go.agentimpact.fr}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Nadir — Agent Impact}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO:-nadir@agentimpact.fr}
      BREVO_WEBHOOK_TOKEN: ${BREVO_WEBHOOK_TOKEN:-}
      OUTREACH_LAUNCH_DATE: ${OUTREACH_LAUNCH_DATE:-}
      DEMO_TTL_DAYS: ${DEMO_TTL_DAYS:-14}
      DEMO_PUBLIC_BASE: ${DEMO_PUBLIC_BASE:-https://demo.agentimpact.fr}
      TRAINING_FORM_TOKEN: ${TRAINING_FORM_TOKEN:?TRAINING_FORM_TOKEN manquant dans .env}
      DASHBOARD_ACCESS_TOKEN: ${DASHBOARD_ACCESS_TOKEN:?DASHBOARD_ACCESS_TOKEN manquant dans .env}
      # Superset public RPC bridge only — never mount private executor / credstore / docker socket.
      AGENTIMPACT_SUPERSET_RPC_SOCKET: /run/agentimpact-superset-rpc/bridge.sock
      AGENTIMPACT_V2_ENABLED: "1"
      AGENTIMPACT_V2_PROJECTS: ${AGENTIMPACT_V2_PROJECTS:-PLU-IA}
      AGENTIMPACT_ORGANIZATION_ID: ${AGENTIMPACT_ORGANIZATION_ID:-org-agentimpact}
      AGENTIMPACT_V2_EXECUTION_ENABLED: "0"
      AGENTIMPACT_SUPERSET_AGENT_EXECUTION_ENABLED: "0"
      AGENTIMPACT_EXECUTION_BACKEND: custom
      AGENTIMPACT_V2_CODEX_PUBLISHER_ENABLED: "0"
      AGENTIMPACT_JARVIS_ENABLED: "1"
      AGENTIMPACT_JARVIS_MUTATIONS_ENABLED: "1"
      AGENTIMPACT_PUBLISHER_ENABLED: "0"
      AGENTIMPACT_DEPLOY_ENABLED: "0"
    env_file:
      - /etc/agentimpact/tokens/bridge.env
      - /etc/agentimpact/tokens/hermes.env
      - /etc/agentimpact/tokens/admin.env
    volumes:
      # Stable socket endpoint only; no Superset credential, binary, state or Docker socket is mounted.
      - /run/agentimpact-superset-rpc/bridge.sock:/run/agentimpact-superset-rpc/bridge.sock
      # Credentials Google montes en lecture seule : root/hermes must provision
      # this as 0640 hermes:hermes; GOOGLE_TOKEN_GID may override the host GID.
      - /home/hermes/.hermes/google_token.json:/secrets/google_token.json:ro
      # Lecture seule : l'API verifie l'existence des fichiers, ne les ecrit
      # jamais (dev-senior ecrit via son propre montage sandbox).
      - /opt/agentimpact/demos:/opt/agentimpact/demos:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health',{headers:{authorization:'Bearer '+process.env.CTL_BRIDGE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Expose uniquement en local. Le callback FullEnrich passe par le tunnel
    # cloudflared (/etc/cloudflared/config.yml), restreint au seul chemin
    # /api/fullenrich/webhook.
    ports:
      - "127.0.0.1:3000:3000"

  demo-static:
    image: nginx:alpine
    container_name: agentimpact-demo-static
    restart: unless-stopped
    volumes:
      - /opt/agentimpact/demos:/usr/share/nginx/html:ro
      - /opt/agentimpact/nginx-demos.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.agentimpact-demo.rule: "Host(`demo.agentimpact.fr`)"
      traefik.http.routers.agentimpact-demo.entrypoints: "websecure"
      traefik.http.routers.agentimpact-demo.tls: "true"
      traefik.http.routers.agentimpact-demo.tls.certresolver: "mytlschallenge"
      traefik.http.services.agentimpact-demo.loadbalancer.server.port: "80"

volumes:
  postgres_data:

networks:
  web:
    external: true
    name: root_web
