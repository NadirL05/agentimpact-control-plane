name: CI — Source TypeScript

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Install isolated PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-16

      - name: Native PostgreSQL concurrency tests
        run: bash ../infra/scripts/test-v2-a-postgres.sh

      - name: Python consumer regression tests
        run: python3 -m unittest discover -s ../infra/scripts -p 'test_*.py'
